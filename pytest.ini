[pytest]
# Filtro deliberadamente estreito: casa a mensagem exata e nada mais.
#
# O joblib, ao desserializar o pipeline scikit-learn de models/, faz
# `array.shape = ...`, comportamento que o NumPy 2.5 depreciou. São ~1.300
# linhas por execução, todas de tests/test_api.py, que carrega o artefato. Esse
# volume faz um aviso de verdade passar batido — que é justamente a função do
# aviso, então o ruído é pior que inofensivo.
#
# Não é do nosso código e não dá para corrigir aqui: o joblib 1.6.0 ainda não
# traz o ajuste (conferido no CHANGES.rst do projeto). Quando trouxer, suba o
# pin em requirements.txt e requirements-api.txt e apague esta entrada.
#
# O risco que fica registrado: se uma versão do NumPy *remover* o comportamento
# em vez de depreciá-lo, `joblib.load` passa a falhar e a API não sobe, porque
# ela carrega o ambiente no startup. O que segura isso é o pin numpy==2.5.1 —
# não este filtro, que só esconde o aviso.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
