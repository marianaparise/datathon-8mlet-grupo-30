# Sobe a API e a UI do MLflow juntas — as duas telas que aparecem na demo.
#
# Pré-requisito: `make train`, que gera models/environment.joblib e mlflow.db.
# Sem eles a API responde `degraded` no /health e o MLflow sobe vazio.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tc5-api:latest
    container_name: tc5-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health").status == 200 else 1)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mlflow:
    image: tc5-api:latest
    container_name: tc5-mlflow
    # A imagem de serving não traz MLflow — instalar aqui mantém o container da
    # API enxuto e a UI disponível para a demo, que é o que interessa.
    entrypoint: >
      sh -c "pip install --no-cache-dir mlflow==3.15.1 &&
             mlflow ui --backend-store-uri sqlite:////app/mlflow.db
                       --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db:ro
    depends_on:
      - api
    restart: unless-stopped
